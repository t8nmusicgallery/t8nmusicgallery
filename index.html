<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>T8N Music Gallery</title>
	<link rel="stylesheet" href="style.css">
	<link rel="icon" href="images/favicon.ico" type="image/x-icon">
</head>
<body>
	<header class="hero-container">
		<div class="hero-text">
			<h1>Welcome to The Gallery</h1>
		</div>
	</header>

	<main class="gal-cont">
		<section class="gallery">
			<h2>Music I've Made</h2>

			<div class="song-card">
				<h3>Newest Release</h3>
				<img src="images/Sparkling.png" alt="Thumbnail Missing">
				<h4>Sparkling</h4>
				<audio controls>
					<source src="songs/Sparkling.mp3" type="audio/mpeg">
				</audio>
			</div>

			<h2>Nokia Ringtone Covers</h2>

			<div class="song-card">
				<img src="images/Clair De Lunokia.png" alt="Thumbnail Missing">
				<h4>Clair De Lunokia</h4>
				<audio controls>
					<source src="songs/Clair De Lunokia.mp3" type="audio/mpeg">
				</audio>
			</div>

			<div class="song-card">
				<img src="images/Erikia.png" alt="Thumbnail Missing">
				<h4>Erikia</h4>
				<audio controls>
					<source src="songs/Erikia.mp3" type="audio/mpeg">
				</audio>
			</div>

			<div class="song-card">
				<img src="images/Burnokia.png" alt="Thumbnail Missing">
				<h4>Burnokia</h4>
				<audio controls>
					<source src="songs/Burnokia.mp3" type="audio/mpeg">
				</audio>
			</div>

			<div class="song-card">
				<img src="images/In The Hall Of The Mountainokia King.png" alt="Thumbnail Missing">
				<h4>In The Hall of The Mountainokia King</h4>
				<audio controls>
					<source src="songs/In The Hall Of The Mountainokia King.mp3" type="audio/mpeg">
				</audio>
			</div>

			<div class="song-card">
				<img src="images/Toccatakia.png" alt="Thumbnail Missing">
				<h4>Toccatakia</h4>
				<audio controls>
					<source src="songs/Toccatakia.mp3" type="audio/mpeg">
				</audio>
			</div>
		</section>
	</main>
</body>
</html>
